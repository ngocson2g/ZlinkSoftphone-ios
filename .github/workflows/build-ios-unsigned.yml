name: Build iOS App (Unsigned)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Allows you to manually trigger the build from GitHub UI

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project LinphoneApp.xcodeproj -scheme LinphoneApp -derivedDataPath Build/

      - name: Build Unsigned App
        run: |
          xcodebuild build \
            -project LinphoneApp.xcodeproj \
            -scheme LinphoneApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath Build/ \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          # Find the built .app file
          APP_PATH=$(find Build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          
          # Create Payload directory
          mkdir -p Payload
          
          # Copy .app into Payload
          cp -r "$APP_PATH" Payload/
          
          # Zip into .ipa
          zip -qr ZlinkSoftphone.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZlinkSoftphone
          path: ZlinkSoftphone.ipa
          retention-days: 7
